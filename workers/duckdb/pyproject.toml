[project]
name = "openrelik-worker-duckdb"
version = "0.1.0"
description = "Convert plaso JSON lines to Parquet with DuckDB"
authors = [{ name = "OpenRelik Authors" }]
requires-python = ">=3.12,<4"
readme = "README.md"
dependencies = [
    "celery[redis]>=5.4.0,<6",
    "openrelik-common>=0.7.7,<1.0.0",
    "openrelik-worker-common>=0.17,<1.0.0",
    "duckdb>=1.3,<2",
    "pyarrow>=17",
]

[dependency-groups]
test = [
    "pytest",
    "pytest-cov>=5.0.0,<6",
    "pytest-mock>=3.14.0,<4",
]

[tool.uv]
package = false
default-groups = []
