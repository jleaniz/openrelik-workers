# Showcase this worker on https://openrelik.org/marketplace
publish: false

# Worker Metadata. This section is required.
display_name: Plaso JSON lines to Parquet
description: Convert plaso JSON lines (psort -o json_line) to Parquet with DuckDB, with typed columns for common event fields and an attributes JSON column for the rest.

# Optional: Third-Party Tools Used by the Worker.
tools:
  - display_name: DuckDB
    description: In-process analytical database used to stream JSON lines into Parquet
    url: https://duckdb.org/
